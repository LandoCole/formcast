[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formcast"
version = "0.1.0"
description = "Turn blank PDF forms into field templates using an LLM agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "commonforms>=0.2.1",
  "pydantic>=2.11",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "numpy",
  "pillow",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow and not llm'"
markers = [
  "slow: downloads or loads models (run with -m slow)",
  "llm: calls a real LLM (run with -m llm)",
]
filterwarnings = [
  # PyMuPDF's SWIG bindings warn on import under Python 3.12 (dependency issue).
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
  # torch warns on import inside ultralytics/rfdetr (dependency issue).
  "ignore:`torch.jit.script` is deprecated:FutureWarning",
]
