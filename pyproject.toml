[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm-lab"
version = "0.1.0"
description = "Exploratory DSPy.RLM lab with tracing, retrieval, and a Streamlit UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dspy>=3.1.3,<3.2",
  "pydantic>=2.12,<3",
  "streamlit>=1.56,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
